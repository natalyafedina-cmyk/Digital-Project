name: Security update - Vitest

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-vitest.yml"

permissions:
  contents: write

jobs:
  update-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update Vitest
        run: npm install --save-dev --save-exact vitest@4.1.11

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit after update
        run: npm audit --json || true

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update Vitest to 4.1.11"
          git push origin HEAD:main
